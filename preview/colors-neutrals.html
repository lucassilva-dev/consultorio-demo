<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);display:flex;gap:14px;align-items:flex-end}.s{display:flex;flex-direction:column;align-items:center;gap:8px}.sw{width:88px;height:88px;border-radius:14px;border:1px solid rgba(58,42,34,.06)}.lab{font-family:var(--font-body);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted)}.hex{font-family:var(--font-body);font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}</style></head><body>
<div class="s"><div class="sw" style="background:#F6EFE7"></div><div class="lab">bg</div><div class="hex">#F6EFE7</div></div>
<div class="s"><div class="sw" style="background:#EFE5D8"></div><div class="lab">bg-soft</div><div class="hex">#EFE5D8</div></div>
<div class="s"><div class="sw" style="background:#FBF6EF"></div><div class="lab">bg-card</div><div class="hex">#FBF6EF</div></div>
<div class="s"><div class="sw" style="background:#3A2A22"></div><div class="lab">fg</div><div class="hex">#3A2A22</div></div>
<div class="s"><div class="sw" style="background:#6B544A"></div><div class="lab">fg-muted</div><div class="hex">#6B544A</div></div>
<div class="s"><div class="sw" style="background:#8A7568"></div><div class="lab">fg-soft</div><div class="hex">#8A7568</div></div>
</body></html>
