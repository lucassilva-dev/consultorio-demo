<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:32px 36px;background:var(--bg)}label{display:block;font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:0.04em;color:var(--fg);margin-bottom:8px}input,textarea{width:100%;background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-family:var(--font-body);font-size:16px;color:var(--fg);outline:none;transition:border-color 200ms;box-sizing:border-box}input:focus{border-color:var(--accent)}.hint{font-size:13px;color:var(--fg-soft);margin-top:6px}</style></head><body>
<label>Nome</label><input value="Mariana" />
<div class="hint">Como você prefere ser chamada.</div>
</body></html>
