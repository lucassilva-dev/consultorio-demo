<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);display:flex;gap:14px;align-items:flex-end}.s{display:flex;flex-direction:column;align-items:center;gap:8px}.sw{width:88px;height:88px;border-radius:14px;border:1px solid rgba(58,42,34,.06)}.lab{font-family:var(--font-body);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-muted)}.hex{font-family:var(--font-body);font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}</style></head><body>
<div class="s"><div class="sw" style="background:#6E2A33"></div><div class="lab">accent</div><div class="hex">#6E2A33</div></div>
<div class="s"><div class="sw" style="background:#4F1E25"></div><div class="lab">accent-deep</div><div class="hex">#4F1E25</div></div>
<div class="s"><div class="sw" style="background:#B98A8E"></div><div class="lab">accent-soft</div><div class="hex">#B98A8E</div></div>
<div class="s"><div class="sw" style="background:#A89BAE"></div><div class="lab">lavender</div><div class="hex">#A89BAE</div></div>
<div class="s"><div class="sw" style="background:#B97A5C"></div><div class="lab">terracotta</div><div class="hex">#B97A5C</div></div>
<div class="s"><div class="sw" style="background:#E4D6C6"></div><div class="lab">line</div><div class="hex">#E4D6C6</div></div>
</body></html>
